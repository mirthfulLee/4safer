[package]
name = "cargo-4safer"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "cargo-4safer"
path = "src/main.rs"

[lib]
name = "foursafer"
path = "src/lib.rs"

[dependencies]
log = "0.4.28"
anyhow = "1.0.100"
clap = { version = "4.5.60", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shlex = "1.3.0"
wait-timeout = "0.2.1"

[dev-dependencies]
tempfile = "3.23.0"

[package.metadata.rust-analyzer]
rustc_private = true
